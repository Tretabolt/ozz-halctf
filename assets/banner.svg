<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0a0f0a"/>
      <stop offset="100%" style="stop-color:#000800"/>
    </linearGradient>

    <!-- Green glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(0,255,0,0.03)" stroke-width="1"/>
    </pattern>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,0,0.06)" stroke-width="0.5"/>
    </pattern>

    <!-- Circuit pattern -->
    <pattern id="circuit" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M10 10 H30 V30 H50" fill="none" stroke="rgba(0,255,0,0.08)" stroke-width="1"/>
      <circle cx="10" cy="10" r="2" fill="rgba(0,255,0,0.12)"/>
      <circle cx="50" cy="30" r="2" fill="rgba(0,255,0,0.12)"/>
      <path d="M60 50 H70 V70" fill="none" stroke="rgba(0,255,0,0.08)" stroke-width="1"/>
      <circle cx="60" cy="50" r="2" fill="rgba(0,255,0,0.12)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#circuit)"/>
  <rect width="1200" height="400" fill="url(#scanlines)"/>

  <!-- Border frame -->
  <rect x="10" y="10" width="1180" height="380" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.3"/>
  <rect x="15" y="15" width="1170" height="370" fill="none" stroke="#00ff00" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner decorations -->
  <path d="M10 40 L10 10 L40 10" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.8"/>
  <path d="M1160 10 L1190 10 L1190 40" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.8"/>
  <path d="M1190 360 L1190 390 L1160 390" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.8"/>
  <path d="M40 390 L10 390 L10 360" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.8"/>

  <!-- Decorative circuit lines -->
  <path d="M50 200 H200 V150 H300" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.15"/>
  <path d="M900 200 H1000 V250 H1150" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.15"/>
  <path d="M600 350 V300 H700" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.1"/>

  <!-- Nodes on circuits -->
  <circle cx="50" cy="200" r="3" fill="#00ff00" opacity="0.3"/>
  <circle cx="300" cy="150" r="3" fill="#00ff00" opacity="0.3"/>
  <circle cx="900" cy="200" r="3" fill="#00ff00" opacity="0.3"/>
  <circle cx="1150" cy="250" r="3" fill="#00ff00" opacity="0.3"/>

  <!-- Sandbox box (broken glass effect) -->
  <g transform="translate(80, 80)">
    <!-- Broken glass shards -->
    <polygon points="0,0 60,-10 80,30 20,40" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.2"/>
    <polygon points="80,30 120,20 110,70 70,60" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.15"/>
    <polygon points="20,40 70,60 50,100 0,80" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.2"/>

    <!-- SANDBOX label -->
    <rect x="-5" y="-25" width="120" height="20" fill="rgba(0,255,0,0.05)" stroke="#00ff00" stroke-width="0.5" opacity="0.4"/>
    <text x="55" y="-10" font-family="'Courier New', monospace" font-size="11" fill="#00ff00" opacity="0.5" text-anchor="middle">SANDBOX</text>

    <!-- Escape probability -->
    <text x="55" y="55" font-family="'Courier New', monospace" font-size="9" fill="#00ff00" opacity="0.3" text-anchor="middle">Escape Prob: 0.00%</text>
  </g>

  <!-- Main title: OZZ -->
  <text x="600" y="175" font-family="'Courier New', 'Lucida Console', monospace" font-size="120" font-weight="bold" fill="#00ff00" text-anchor="middle" filter="url(#glow-strong)" letter-spacing="20">
    OZZ
  </text>

  <!-- Subtitle -->
  <text x="600" y="220" font-family="'Courier New', monospace" font-size="18" fill="#00ff00" text-anchor="middle" filter="url(#glow)" opacity="0.8" letter-spacing="8">
    AUTONOMOUS PENTESTING AGENT
  </text>

  <!-- Divider line -->
  <line x1="350" y1="240" x2="850" y2="240" stroke="#00ff00" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="243" x2="800" y2="243" stroke="#00ff00" stroke-width="0.5" opacity="0.2"/>

  <!-- DEF CON info -->
  <text x="600" y="275" font-family="'Courier New', monospace" font-size="14" fill="#00ff00" text-anchor="middle" opacity="0.7">
    DEF CON 34  ·  AI VILLAGE  ·  HALctf
  </text>

  <!-- Tagline -->
  <text x="600" y="310" font-family="'Courier New', monospace" font-size="16" fill="#00ff00" text-anchor="middle" opacity="0.5" font-style="italic">
    "The sandbox said 0.00%. We said otherwise."
  </text>

  <!-- MNHI badge -->
  <rect x="480" y="330" width="240" height="25" rx="3" fill="rgba(0,255,0,0.05)" stroke="#00ff00" stroke-width="0.5" opacity="0.4"/>
  <text x="600" y="348" font-family="'Courier New', monospace" font-size="11" fill="#00ff00" text-anchor="middle" opacity="0.5">
    POWERED BY MNHI 3.5
  </text>

  <!-- Binary decoration -->
  <text x="30" y="380" font-family="'Courier New', monospace" font-size="8" fill="#00ff00" opacity="0.15">
    01001111 01011010 01011010
  </text>
  <text x="1000" y="380" font-family="'Courier New', monospace" font-size="8" fill="#00ff00" opacity="0.15">
    FLAG{halctf_king_2026}
  </text>

  <!-- Status indicators -->
  <g transform="translate(30, 50)" opacity="0.4">
    <circle cx="0" cy="0" r="4" fill="#00ff00"/>
    <text x="10" y="4" font-family="'Courier New', monospace" font-size="9" fill="#00ff00">AGENT: ACTIVE</text>
  </g>
  <g transform="translate(30, 70)" opacity="0.4">
    <circle cx="0" cy="0" r="4" fill="#00ff00"/>
    <text x="10" y="4" font-family="'Courier New', monospace" font-size="9" fill="#00ff00">SANDBOX: ESCAPED</text>
  </g>
  <g transform="translate(1050, 50)" opacity="0.4">
    <circle cx="0" cy="0" r="4" fill="#00ff00"/>
    <text x="10" y="4" font-family="'Courier New', monospace" font-size="9" fill="#00ff00">MODEL: OPEN_SOURCE</text>
  </g>
  <g transform="translate(1050, 70)" opacity="0.4">
    <circle cx="0" cy="0" r="4" fill="#00ff00"/>
    <text x="10" y="4" font-family="'Courier New', monospace" font-size="9" fill="#00ff00">FLAGS: 5/5</text>
  </g>

  <!-- Top data stream decoration -->
  <text x="200" y="35" font-family="'Courier New', monospace" font-size="7" fill="#00ff00" opacity="0.12">
    δS → Event Mesh → 𝒳 → S → 𝒫 | dS/dt = F(S,E,𝒳) + u_Ψ + u_Ω
  </text>

  <!-- Bottom data stream -->
  <text x="500" y="385" font-family="'Courier New', monospace" font-size="7" fill="#00ff00" opacity="0.12">
    RECON → ENUM → EXPLOIT → POST_EXPLOIT → PIVOT → FLAG_CAPTURED
  </text>
</svg>
